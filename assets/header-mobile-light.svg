  <text x="30" y="122" fill="#203536" font-family="Georgia, 'Times New Roman', serif" font-size="48" letter-spacing="-1.8">Dhananjay Sarathe.</text>
  <text x="32" y="169" fill="#203536" font-family="Arial, Helvetica, sans-serif" font-size="24">Founding engineer. Curious builder.</text>
